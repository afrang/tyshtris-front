name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Resolve build args
        id: args
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_PAYPAL_BUSINESS: ${{ vars.NEXT_PUBLIC_PAYPAL_BUSINESS }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "Set repository variable NEXT_PUBLIC_API_URL to the public CMS API base URL." >&2
              exit 1
            fi
            NEXT_PUBLIC_API_URL="http://localhost:5068"
          fi
          {
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
            echo "NEXT_PUBLIC_PAYPAL_BUSINESS=$NEXT_PUBLIC_PAYPAL_BUSINESS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.args.outputs.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PAYPAL_BUSINESS=${{ steps.args.outputs.NEXT_PUBLIC_PAYPAL_BUSINESS }}
